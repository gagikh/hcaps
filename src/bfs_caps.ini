// bfs_caps.ini: explicit instantiations of BFSCaps::process<operation>. Not a configuration file and not a
// translation unit of its own: bfs_caps.cu #includes it at its very end, after the template definitions.
// Every operation mask that BFSCaps::caps() is called with (include/bfs_caps.hpp) must be listed here,
// otherwise linking fails with an undefined BFSCaps::process<...>. Each line instantiates
// select_kernel<operation> and thereby bfs_kernel<operation, N, R, ...> for every (N, R) of the
// kernel table, so every line adds compile time.

// INSTANTIATE_BFS_PROCESS(n): explicit instantiation of BFSCaps::process<n>
#define INSTANTIATE_BFS_PROCESS(n) template void BFSCaps::process<n>(int, int, cv::cuda::Stream &);

/** The operation flags (copy of the enum in include/bfs_caps.hpp, for reference; keep in sync).
        ENCODE = 1,
        BILINEAR = 2,
        RECONSTRUCT_LEAF_MULTS = 4,
        RECONSTRUCT_INTERMEDIATE_MULTS = 8,
        DECODE = 16,
        FULL_RECONSTRUCT = RECONSTRUCT_LEAF_MULTS | RECONSTRUCT_INTERMEDIATE_MULTS,
        FORWARD = ENCODE | BILINEAR,
        BACKWARD = FULL_RECONSTRUCT | DECODE,
*/

INSTANTIATE_BFS_PROCESS(BFSCaps::ENCODE)
INSTANTIATE_BFS_PROCESS(BFSCaps::DECODE)
INSTANTIATE_BFS_PROCESS(BFSCaps::BILINEAR)
INSTANTIATE_BFS_PROCESS(BFSCaps::RECONSTRUCT_LEAF_MULTS)
INSTANTIATE_BFS_PROCESS(BFSCaps::RECONSTRUCT_INTERMEDIATE_MULTS)

INSTANTIATE_BFS_PROCESS(BFSCaps::FULL_RECONSTRUCT)
INSTANTIATE_BFS_PROCESS(BFSCaps::FORWARD)
INSTANTIATE_BFS_PROCESS(BFSCaps::BACKWARD)
